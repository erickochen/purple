[package]
name = "purple-ssh"
version = "3.26.0"
edition = "2024"
description = "Free, open-source terminal SSH manager and SSH config editor in Rust for macOS and Linux that keeps ~/.ssh/config in sync with 16 cloud providers, monitors live SSH tunnels and manages Docker and Podman containers fleet-wide. Spin up a VM, it shows up. Destroy it, it dims. Plus scp, Vault SSH certs and an MCP server for AI agents. MIT licensed."
license = "MIT"
repository = "https://github.com/erickochen/purple"
homepage = "https://getpurple.sh"
readme = "README.md"
keywords = ["ssh", "ssh-client", "tui", "ssh-manager", "mcp"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.86"
exclude = [".github/", ".gitignore", "demo.gif", "demo.webm", "assets/"]

[lib]
name = "purple_ssh"
path = "src/lib.rs"

[[bin]]
name = "purple"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
glob = "0.3"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2.2"
ureq = { version = "3", features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
hmac = "0.12"
quick-xml = { version = "0.41", features = ["serde", "serialize"] }
rsa = { version = "0.9", features = ["sha2"] }
# default-features off drops the `simd-unsafe` feature, keeping base64 at
# `#![forbid(unsafe_code)]`. We only ever use the scalar GeneralPurpose engine.
base64 = { version = "0.23", default-features = false, features = ["std"] }
libc = "0.2"
log = "0.4"
simplelog = "0.12"
semver = "1"
nucleo-matcher = "0.3"

# Linux-only: per-socket TCP byte counters via NETLINK_SOCK_DIAG. Used
# by src/tcp_diag.rs to populate live tunnel throughput on the Tunnels
# detail panel without spawning the `ss` userland tool.
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-sock-diag = "0.4"
netlink-packet-core = "0.7"
netlink-sys = "0.9"

# musl static builds need OpenSSL compiled from source. Without this,
# native-tls (pulled by ureq) can't find a musl-compatible system openssl
# on Ubuntu CI runners. No effect on glibc/darwin builds.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
mockito = "1.7.2"
proptest = "1"
tempfile = "3"

[lints.clippy]
# Gate production functions against length bloat. Threshold lives in
# clippy.toml (400). Test builds are exempt via a crate-level cfg_attr in
# lib.rs and main.rs.
too_many_lines = "warn"

[profile.release]
strip = true
lto = true
opt-level = "z"
