Host web-01
  HostName %h.prod.example.com
  User eric

Match originalhost web-* !user root
  IdentityFile ~/.ssh/id_web

Match=host *.prod.example.com,!*.lab.example.com exec "test -f ~/.vpn-up"
	ProxyJump bastion
  # purple:tags prod

Match host=*.prod.example.com localuser eric # inline comment
  ProxyCommand none

Match all
  ServerAliveInterval 60
