version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # netlink-packet-sock-diag 0.4.2 pins netlink-packet-core ^0.7, so core
      # 0.8 puts two incompatible copies in the graph and SockDiagMessage stops
      # satisfying NetlinkDeserializable. Patches within 0.7 still come through.
      - dependency-name: netlink-packet-core
        versions: [">= 0.8"]
      # rsa 0.9 signs with the digest 0.10 traits, so its SigningKey and our
      # Hmac need the sha2 0.10 hashers. sha2 0.11 and hmac 0.13 move to digest
      # 0.11 and stop compiling. They move together with rsa 0.10.
      - dependency-name: sha2
        versions: [">= 0.11"]
      - dependency-name: hmac
        versions: [">= 0.13"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain ships a branch per Rust release, so @1.88 is the
      # MSRV pin rather than an action version. Dependabot reads it as semver
      # and asks for a Rust that does not exist. Our other refs are @master and
      # @stable, so nothing here is bumpable anyway.
      - dependency-name: dtolnay/rust-toolchain
